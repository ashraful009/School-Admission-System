server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable caching for the runtime config so a container restart picks up changes
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for all unknown routes
    location / {
        try_files $uri /index.html;
    }
}

